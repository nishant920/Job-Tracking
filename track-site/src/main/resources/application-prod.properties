spring.application.name=Track-site
server.port=${PORT:7070}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# In production, Hibernate validates the database schema without altering live tables. Verifies DB schema matches Java code without modifying anything
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.expiration.time=86400000
jwt.secret.password=${JWT_SECRET}
app.base.url=${APP_BASE_URL}

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

gemini.api-key=${GEMINI_API_KEY}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
