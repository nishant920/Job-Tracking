<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker - Login & Sign Up</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Job Tracker</h1>
      <p>Keep track of your job applications and stay organized.</p>
    </header>

    <div class="form-toggle">
      <button type="button" id="showSigninBtn" class="active">Sign In</button>
      <button type="button" id="showSignupBtn">Sign Up</button>
    </div>

    <section id="signinSection" class="form-section">
      <h2>Sign In</h2>
      <form id="signinForm" action="#" method="POST">
        <div class="form-group">
          <label for="signinEmail">Email Address</label>
          <input type="email" id="signinEmail" name="email" placeholder="Enter your email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="signinPassword">Password</label>
          <input type="password" id="signinPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <div class="form-group checkbox-group">
          <input type="checkbox" id="rememberMe" name="rememberMe">
          <label for="rememberMe">Remember me</label>
        </div>

        <button type="submit">Sign In</button>
        <p id="signinMessage" class="form-message" aria-live="polite"></p>
      </form>
    </section>

    <section id="signupSection" class="form-section is-hidden">
      <h2>Create Account</h2>
      <form id="signupForm" action="#" method="POST">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" name="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" name="email" placeholder="Enter your email" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" name="password" placeholder="Create a password" autocomplete="new-password" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" minlength="6" required>
        </div>

        <button type="submit">Create Account</button>
        <p id="signupMessage" class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
